<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Certificate Verification</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f5f7;
    font-family: Arial, sans-serif;
    color: #1f2937;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 620px;
    background: white;
    border-radius: 18px;
    padding: 32px;
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
  }
  h1 { margin: 0 0 8px; font-size: 28px; text-align: center; }
  .verified {
    text-align: center;
    color: #16803a;
    font-weight: bold;
    margin-bottom: 28px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 15px 0;
    border-bottom: 1px solid #e5e7eb;
  }
  .label { font-weight: bold; color: #4b5563; }
  .value { text-align: right; }
  .footer {
    margin-top: 25px;
    text-align: center;
    color: #6b7280;
    font-size: 13px;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Course Certificate Verification</h1>
    <div class="verified">✓ Certificate Information</div>

    <div class="row">
      <div class="label">Regd. No</div>
      <div class="value">621209525016</div>
    </div>
    <div class="row">
      <div class="label">Name</div>
      <div class="value">Noor Abdulameer Swadi</div>
    </div>
    <div class="row">
      <div class="label">Course</div>
      <div class="value">Intellectual Property Rights (IPR)</div>
    </div>
    <div class="row">
      <div class="label">Percentage</div>
      <div class="value">91%</div>
    </div>
    <div class="row">
      <div class="label">Course Passed</div>
      <div class="value">January 2026 - MAY 2026</div>
    </div>

    <div class="footer">
      This page displays the course information associated with the registration number above.
    </div>
  </main>
</body>
</html>
